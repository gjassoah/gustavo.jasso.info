<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
    <head>
        <meta charset="utf-8">
        <meta name=author content="{{ .Params.Author }}">
        <meta name="google-site-verification" content="2acTKqBrfBSXaKKpgEKGkM4bau9WaahA5kT3pJOUMk8" />
        <title>{{ block "title" . }}{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Home.Title }}{{ end }}{{ end }}</title>
        <link rel="stylesheet" href="/css/style.css">
        <!-- Enable responsiveness on mobile devices -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <script src="/js/navigation.js" defer></script>
    </head>
    <body id="top">
        <a class="skip-link" href="#main-content">{{ i18n "skip-to-content" }}</a>
        <nav id="site-navigation" aria-label="{{ i18n "main-navigation" }}">
            <div class="navigation-inner">
                <ul>
                    {{ range .Site.Menus.main }}
                    <li><a href="{{ .URL }}"{{ if eq $.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
                    {{ end }}
                </ul>
                {{ range .Translations }}
                <span id="language-switcher"><a href="{{ .RelPermalink }}" lang="{{ .Language.Lang }}" hreflang="{{ .Language.Lang }}" aria-label="{{ if eq .Language.Lang "de" }}Deutsch{{ else }}English{{ end }}">{{ upper .Language.Lang }}</a></span>
                {{ end }}
            </div>
        </nav>
        {{ block "main" . }}
        {{ end }}
        <!-- This is the default footer -->
        <footer>
            {{ block "footer" . }}
            {{ end }}
        </footer>
    </body>
</html>
